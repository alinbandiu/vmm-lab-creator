# =============================================================================
#  topo.yml - reference lab containing EVERY VM type this project supports
# =============================================================================
#  Run it:
#    python3 vmm.py -t topo.yml --interfaces         list valid ports per device
#    python3 vmm.py -t topo.yml --config_file_only   generate config, no pod needed
#    python3 vmm.py -t topo.yml --serve              browse the topology diagram
#    python3 vmm.py -t topo.yml                      deploy + configure
#
#  This file is a valid topology, but the FULL lab is 30 VMs / 314 GB / 106 vCPU
#  because most types are a multi-VM chassis (an EVO PTX is RE + FPC + CSPP).
#  Comment out the devices you don't need, plus their links, and check the pod:
#
#      vmm capacity -g vmm-default        # '-g' is required; read BOTH
#                                         # 'Free capacity' and
#                                         # 'Current largest VM available'
#
# -----------------------------------------------------------------------------
#  SUPPORTED TYPES - valid data ports, management interface, console name
# -----------------------------------------------------------------------------
#  type        valid data ports                          mgmt        console
#  ----------- ----------------------------------------- ----------- ----------
#  server      em1, em2, ...        (from em1)           em0         (linux)
#  vswitch     ge-0/0/N             (from 0)             fxp0        {host}
#  vrouter     ge-0/0/N             (from 0)             fxp0        {host}
#  vqfx        xe-0/0/N             (from 0)             em0         {host}
#  vmx         multi-FPC, see catalogue below            fxp0        {host}
#  vferrari    et-0/0/0 .. et-0/0/4                      fxp0        {host}
#  vbugatti    et-0/0/0 .. et-0/0/15                     fxp0        {host}-re0
#  vhamilton   et-<0-2>/0/0 .. et-<0-2>/0/13             em0         {host}_RE
#  vmaserati   et-<0-2>/0/0 .. et-<0-2>/0/19   (pic0)    em0         {host}_RE
#              et-<0-2>/1/0 .. et-<0-2>/1/15   (pic1)
#  valfaromeo  et-<0-2>/0/<0-3>:<0-3>  channelized       em0         {host}-re0
#  vscapa      et-0/0/1,3,5,...,15    ODD ONLY           re0:mgmt-0  {host}_RE0
#  vbowmore    et-0/0/1,3,5,...,15    ODD ONLY           re0:mgmt-0  {host}_RE0
#  vardbeg     et-0/0/0 .. et-0/0/11                     re0:mgmt-0  {host}_RE0
#  vbalerion   et-0/0/9 .. et-0/0/26  STARTS AT 9        re0:mgmt-0  {host}_RE0
#  vbrackla    et-1/0/0 .. et-1/0/4   FPC1, NOT FPC0     re0:mgmt-0  {host}_RE0
#
#  vmx FPC catalogue (sparse - use any subset):
#      FPC0: ge-0/0/0-9, ge-0/1/0-9, xe-0/2/0-1, xe-0/3/0-1
#      FPC1: xe-1/0/0-5:0-3        FPC2: xe-2/0/0-5:0-3
#      FPC3: et-3/0/0-5            FPC5: xe-5/0/0-11        (there is no FPC4)
#
#  FPCs: vhamilton, vmaserati and valfaromeo add a linecard on demand - an
#  et-1/... port emits FPC1, et-2/... emits FPC2. You never declare a linecard.
#  Every other type is single-FPC (FPC0), except vbrackla which is FPC1 only.
#
#  Gotchas that bite:
#    - vscapa / vbowmore are ODD ports only; et-0/0/0 does not exist in Junos.
#    - vbalerion starts at et-0/0/9, not 0.
#    - vbrackla is FPC1, so et-1/0/0 - not et-0/0/0.
#    - A port outside these ranges still builds a bridge, so the link comes up
#      and silently passes no traffic. The generator rejects them for you.
#    - Disk alias MUST start with the type name (VROUTER_DISK and VSWITCH_DISK
#      are the two literal exceptions).
#    - Chassis I2C ids are NOT a per-lab unique key, they identify a chassis
#      MODEL, so different types sharing one is harmless. vmx and valfaromeo
#      are both 21 and boot together fine (verified: MX960 and JNP10008 each
#      come up with the right model and FPC, and traffic passes between them).
#      vhamilton and vmaserati are both 273. The only case needing distinct ids
#      is several vbugatti chassis in one lab, auto-numbered 22, 23, 24, ...
#      You never set this yourself.
#    - There is no 'sniffer' type: it is a 'server' on sniffer_disk, spliced
#      into any link marked 'sniffer: true'.
#    - Retired: 'vptx' and 'vredbull'. Validation rejects both and names the
#      replacement type.
#
#  All types mix freely - this file is the proof. Order of 'vms:' doesn't matter.
# =============================================================================

lab_name: REFERENCE-ALL-TYPES

# -----------------------------------------------------------------------------
#  DISKS - alias -> image path. Alias must be prefixed with the type name.
# -----------------------------------------------------------------------------
disks:
  # Linux
  server_disk:     /vmm/data/base_disks/ubuntu/ubuntu-22.04.qcow2
  sniffer_disk:    /vmm/data/base_disks/ubuntu/ubuntu-22.04.qcow2

  # vJunos / classic
  VROUTER_DISK:    /vmm/data/base_disks/junos/vmx/vJunos-router-24.2R2-S1.6.qcow2
  VSWITCH_DISK:    /vmm/data/base_disks/junos/vex/vJunos-switch-24.2R2-S1.6.qcow2
  vqfx_disk:       /vmm/data/base_disks/default_images/default_image_vqfx10.img
  vmx_disk:        /vmm/data/base_disks/junos/vmx/junos-virtual-x86-64-23.4R2-S3.9.vmdk
  # vferrari is the ONLY type with no default_image_* on the pods - point this
  # at your own vMX .vmdk build.
  vferrari_disk:   /homes/balinfilipga/images/junos-virtual-x86-64-22.4R3-S4.5.vmdk

  # MX family
  vbugatti_disk:   /vmm/data/base_disks/default_images/default_image_vbugatti.img
  vhamilton_disk:  /vmm/data/base_disks/default_images/default_image_vhamilton.img
  vmaserati_disk:  /vmm/data/base_disks/default_images/default_image_vmaserati.img
  valfaromeo_disk: /vmm/data/base_disks/default_images/default_image_valfaromeo.img

  # EVO PTX
  vscapa_disk:     /vmm/data/base_disks/default_images/default_image_vscapa.img
  vardbeg_disk:    /vmm/data/base_disks/default_images/default_image_vardbeg.img
  vbrackla_disk:   /vmm/data/base_disks/default_images/default_image_vbrackla.img
  vbalerion_disk:  /vmm/data/base_disks/default_images/default_image_vbalerion.img
  vbowmore_disk:   /vmm/data/base_disks/default_images/default_image_vbowmore.img

# -----------------------------------------------------------------------------
#  VMS - one entry per device. Management interface is chosen by type.
#  Optional per-VM overrides: 'ncpus', 'memory' (MB).
# -----------------------------------------------------------------------------
vms:
  # ---- Linux ----------------------------------------------------------------
  - hostname: host1                 # data ports em1, em2, ... (sequential)
    type: server
    disk: server_disk
    ncpus: 2
    memory: 2048

  # ---- vJunos / classic Junos ----------------------------------------------
  - hostname: vswitch1              # vJunos-switch (EX)
    type: vswitch
    disk: VSWITCH_DISK

  - hostname: vqfx1                 # vQFX10k
    type: vqfx
    disk: vqfx_disk

  - hostname: vrouter1              # vJunos-router (MX)
    type: vrouter
    disk: VROUTER_DISK

  - hostname: vmx1                  # classic vMX, sparse multi-FPC catalogue
    type: vmx
    disk: vmx_disk

  - hostname: vferrari1             # ZT MPC10E, 5 x 100G on FPC0
    type: vferrari
    disk: vferrari_disk

  # ---- MX family ------------------------------------------------------------
  - hostname: vbugatti1             # MX304 + LC304, 16 x 100G
    type: vbugatti
    disk: vbugatti_disk

  - hostname: vhamilton1            # vMX10004 + LC4800, 14 ports per FPC
    type: vhamilton
    disk: vhamilton_disk

  - hostname: vmaserati1            # vMX10004 + XT LC, 2 pics / 36 ports per FPC
    type: vmaserati
    disk: vmaserati_disk

  - hostname: valfaromeo1           # MX10008 + LC9600, channelized 4x4 per FPC
    type: valfaromeo
    disk: valfaromeo_disk

  # ---- EVO PTX --------------------------------------------------------------
  - hostname: vscapa1               # ODD ports only
    type: vscapa
    disk: vscapa_disk

  - hostname: vardbeg1              # et-0/0/0 .. et-0/0/11
    type: vardbeg
    disk: vardbeg_disk

  - hostname: vbrackla1             # FPC1 - et-1/0/0 .. et-1/0/4
    type: vbrackla
    disk: vbrackla_disk

  - hostname: vbalerion1            # starts at et-0/0/9
    type: vbalerion
    disk: vbalerion_disk

  - hostname: vbowmore1             # ODD ports only
    type: vbowmore
    disk: vbowmore_disk

  # ---- Capture --------------------------------------------------------------
  - hostname: Sniffer               # a 'server' spliced into any 'sniffer: true' link
    type: server
    disk: sniffer_disk
    ncpus: 4
    memory: 2048

# -----------------------------------------------------------------------------
#  LINKS - one chain through every type.
#  Format: endpoints: ["hostname:interface", "hostname:interface"]
# -----------------------------------------------------------------------------
links:
  # Linux -> vJunos
  - endpoints: ["host1:em1",             "vswitch1:ge-0/0/0"]
  - endpoints: ["vswitch1:ge-0/0/1",     "vqfx1:xe-0/0/0"]
  - endpoints: ["vqfx1:xe-0/0/1",        "vrouter1:ge-0/0/0"]
  - endpoints: ["vrouter1:ge-0/0/1",     "vmx1:ge-0/0/0"]
  - endpoints: ["vmx1:ge-0/0/1",         "vferrari1:et-0/0/0"]

  # -> MX family
  - endpoints: ["vferrari1:et-0/0/1",    "vbugatti1:et-0/0/0"]
  - endpoints: ["vbugatti1:et-0/0/1",    "vhamilton1:et-0/0/0"]
  - endpoints: ["vhamilton1:et-0/0/1",   "vmaserati1:et-0/0/0"]

  # vmaserati pic1 -> EVO
  - endpoints: ["vmaserati1:et-0/1/0",   "vscapa1:et-0/0/1"]

  # -> EVO PTX chain
  - endpoints: ["vscapa1:et-0/0/3",      "vardbeg1:et-0/0/0"]
  - endpoints: ["vardbeg1:et-0/0/1",     "vbrackla1:et-1/0/0"]
    sniffer: true                        # <- capture point
  - endpoints: ["vbrackla1:et-1/0/1",    "vbalerion1:et-0/0/9"]
  - endpoints: ["vbalerion1:et-0/0/10",  "vbowmore1:et-0/0/1"]

  # -> channelized
  - endpoints: ["vbowmore1:et-0/0/3",    "valfaromeo1:et-0/0/0:0"]
