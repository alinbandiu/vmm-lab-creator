# Mixed lab: vMX + vFerrari + vAlfaRomeo (+ a Linux server).
#
# Legal per the compatibility matrix in topo.yml - vAlfaRomeo only conflicts
# with vptx / vscapa / vbrackla, none of which are used here.
#
# NOTE: this is the first combination that puts common.vmx.p3.defs (needed by
# vmx and vFerrari) in the same file as vAlfaRomeo's own common.vptx.defs.
# The two are believed to be independent - vFerrari already coexisted with
# vAlfaRomeo in an earlier run - but this specific mix has not been proven on
# the pod yet. If 'vmm config' complains about a VMX_* or VPTX_* macro, that
# is the interaction to look at, and vmm.py's INCOMPATIBLE_TYPE_GROUPS is
# where the rule would be added.

lab_name: MIXED-LAB

disks:
  vmx_disk: /vmm/data/base_disks/junos/vmx/junos-virtual-x86-64-23.4R2-S3.9.vmdk
  vferrari_disk: /homes/balinfilipga/images/junos-virtual-x86-64-22.4R3-S4.5.vmdk
  valfaromeo_disk: /homes/balinfilipga/images/junos-virtual-x86-64-22.4R3-S4.5.vmdk
  server_disk: /vmm/data/base_disks/ubuntu/ubuntu-22.04.qcow2

vms:
  - hostname: server
    type: server
    disk: server_disk
    ncpus: 2
    memory: 2048
    # Interfaces em1, em2, ... (em0 is the management bridge)

  - hostname: R1
    type: vmx
    disk: vmx_disk
    # Supported vmx interfaces (fixed multi-FPC hardware profile - use any
    # subset, unused ones are fine):
    #   FPC0 (LU-CHIP):   ge-0/0/0-9, ge-0/1/0-9, xe-0/2/0-1, xe-0/3/0-1
    #   FPC1 (EA 10G):    xe-1/0/0-5:0-3
    #   FPC2 (EA 10G):    xe-2/0/0-5:0-3
    #   FPC3 (EA 40G):    et-3/0/0-5
    #   FPC5 (XL 10G):    xe-5/0/0-11
    #   (FPC4 is not available on this profile)

  - hostname: PE2
    type: vferrari
    disk: vferrari_disk
    # Management on fxp0. Supported vferrari interfaces:
    #   et-0/0/0   et-0/0/1   et-0/0/2   et-0/0/3   et-0/0/4

  - hostname: PE1
    type: valfaromeo
    disk: valfaromeo_disk
    # Management on em0 (NOT fxp0). Supported valfaromeo interfaces
    # (et-0/0/<port>:<subport>):
    #   et-0/0/0:0   et-0/0/0:1   et-0/0/0:2   et-0/0/0:3
    #   et-0/0/1:0   et-0/0/1:1   et-0/0/1:2   et-0/0/1:3
    #   et-0/0/2:0   et-0/0/2:1   et-0/0/2:2   et-0/0/2:3
    #   et-0/0/3:0   et-0/0/3:1   et-0/0/3:2   et-0/0/3:3

links:
  # vAlfaRomeo <-> vFerrari
  - endpoints: ["PE1:et-0/0/0:0", "PE2:et-0/0/0"]
  # vAlfaRomeo <-> vMX (FPC3 100G)
  - endpoints: ["PE1:et-0/0/0:1", "R1:et-3/0/0"]
  # vFerrari <-> vMX (FPC0)
  - endpoints: ["PE2:et-0/0/1", "R1:ge-0/0/0"]
  # vMX <-> server
  - endpoints: ["R1:ge-0/0/1", "server:em1"]
