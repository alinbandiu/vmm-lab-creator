# Standalone vAlfaRomeo + vFerrari lab.
#
# This mirrors the known-good hand-written VMM config 1:1 (same VMs, same
# links, same bridge assignments) so the generated output can be compared
# against it directly.
#
# vAlfaRomeo ships its OWN common.vptx.defs under
# /vmm/data/user_disks/dhahm/valfaromeo/, which defines the VPTX_* chassis
# macros and IF_ET_CHAN differently from the standard
# /vmm/data/vmm-configs/common/vmxc/common.vptx.defs. It therefore cannot share
# a topology with vptx, vscapa or vbrackla - vmm.py rejects that combination
# during validation. vferrari is fine alongside it.

lab_name: vAlfaRomeo and vFerrari

disks:
  vferrari_disk: /homes/balinfilipga/images/junos-virtual-x86-64-22.4R3-S4.5.vmdk
  valfaromeo_disk: /homes/balinfilipga/images/junos-virtual-x86-64-22.4R3-S4.5.vmdk
  server_disk: /vmm/data/base_disks/ubuntu/ubuntu-22.04.qcow2

vms:
  - hostname: server
    type: server
    disk: server_disk
    ncpus: 2
    memory: 2048

  - hostname: PE2
    type: vferrari
    disk: vferrari_disk
    # Supported vferrari interfaces:
    #   et-0/0/0   et-0/0/1   et-0/0/2   et-0/0/3   et-0/0/4

  - hostname: PE1
    type: valfaromeo
    disk: valfaromeo_disk
    # Supported valfaromeo interfaces (et-0/0/<port>:<subport>):
    #   et-0/0/0:0   et-0/0/0:1   et-0/0/0:2   et-0/0/0:3
    #   et-0/0/1:0   et-0/0/1:1   et-0/0/1:2   et-0/0/1:3
    #   et-0/0/2:0   et-0/0/2:1   et-0/0/2:2   et-0/0/2:3
    #   et-0/0/3:0   et-0/0/3:1   et-0/0/3:2   et-0/0/3:3

links:
  - endpoints: ["PE2:et-0/0/0", "PE1:et-0/0/0:0"]
  - endpoints: ["PE2:et-0/0/1", "PE1:et-0/0/0:1"]
  - endpoints: ["PE2:et-0/0/2", "server:em1"]
  - endpoints: ["PE1:et-0/0/0:2", "server:em2"]
